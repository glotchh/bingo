<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solo Bingo with Settings Engine</title>
    <style>
        :root {
            --bg-main: #050507;      
            --bg-card: rgba(13, 14, 18, 0.75);      
            --bg-surface: rgba(22, 24, 32, 0.85);   
            --border-color: rgba(34, 37, 51, 0.6);
            --text-main: #f9fafb;
            --text-muted: #cbd5e1;
            --accent: #38bdf8;       
            --accent-glow: rgba(56, 189, 248, 0.3);
            --danger: #ef4444;       
            --danger-glow: rgba(239, 68, 68, 0.3);
            --gold: #f59e0b;
            --gold-glow: rgba(245, 158, 11, 0.5);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            position: relative;
            overflow-x: hidden;
        }

        /* Video Background Wrapper */
        .video-bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            overflow: hidden;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
        }

        .video-bg-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Dark overlay layer to guarantee text readability */
        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(5, 5, 7, 0.4) 0%, rgba(5, 5, 7, 0.75) 100%);
            backdrop-filter: blur(2px); 
            z-index: -1;
        }

        /* Top Layout Header */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 500px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin: 0;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            background: linear-gradient(to right, #ffffff, #93c5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .button-group {
            display: flex;
            gap: 8px;
            align-items: stretch; /* Forces equal height match */
        }

        /* Control Buttons */
        .btn {
            background-color: var(--bg-surface);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 18px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn:hover {
            background-color: var(--text-main);
            color: var(--bg-main);
            border-color: var(--text-main);
        }

        .btn:disabled {
            opacity: 0.2;
            cursor: not-allowed;
        }

        .btn-primary {
            background-color: var(--accent);
            color: var(--bg-main);
            border: none;
        }
        .btn-primary:hover {
            background-color: #7dd3fc;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .btn-icon {
            padding: 10px 14px;
            font-size: 1.1rem;
        }

        /* Dynamic Options Settings Menu Tray */
        .settings-panel {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            max-width: 500px;
            width: 100%;
            box-sizing: border-box;
            padding: 20px;
            margin-bottom: 16px;
            backdrop-filter: blur(8px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            display: none; /* Controlled by toggle script */
            flex-direction: column;
            gap: 16px;
            animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideDown {
            from { transform: translateY(-10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .setting-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .setting-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        .setting-input-wrapper {
            display: flex;
            gap: 8px;
        }

        .text-input {
            background: rgba(5, 5, 7, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px;
            color: var(--text-main);
            font-size: 0.85rem;
            flex-grow: 1;
            outline: none;
            transition: border-color 0.2s;
        }

        .text-input:focus {
            border-color: var(--accent);
        }

        /* Sleek Modern Slider Styling */
        .slider-input {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin: 12px 0;
            cursor: pointer;
            outline: none;
            transition: background 0.2s;
        }

        .slider-input:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Slider Thumb Styling */
        .slider-input::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
            transition: transform 0.1s, background-color 0.2s;
        }

        .slider-input::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            background: #7dd3fc;
        }

        .slider-input::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border: none;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
            transition: transform 0.1s, background-color 0.2s;
            cursor: pointer;
        }

        .slider-input::-moz-range-thumb:hover {
            transform: scale(1.2);
            background: #7dd3fc;
        }

        /* Layout Structure Containers */
        .game-layout {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 500px;
        }

        /* Live Call Display Block */
        .live-display {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
        }

        .ball-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px 0;
        }

        .ball-number {
            font-size: 4rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            color: rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
        }

        .ball-number.active {
            color: var(--text-main);
            text-shadow: 0 0 30px rgba(56, 189, 248, 0.6);
        }

        .status-text {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 0.02em;
            text-shadow: 0 1px 4px rgba(0,0,0,0.6);
        }

        /* Health HUD Panel */
        .health-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 4px 0;
        }

        .heart {
            font-size: 1.8rem;
            color: var(--danger);
            filter: drop-shadow(0 0 8px var(--danger-glow));
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: inline-block;
        }

        .heart.lost {
            transform: scale(0);
            opacity: 0;
            width: 0;
            margin: 0 -6px;
        }

        /* Ultra-rounded Grid Board */
        .bingo-board {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 16px;
            box-shadow: 0 24px 50px rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
        }

        .cell {
            aspect-ratio: 1;
            background-color: rgba(5, 5, 7, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 50%; 
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
        }

        .cell:hover:not(.marked) {
            border-color: var(--accent);
            color: var(--text-main);
            background-color: rgba(56, 189, 248, 0.15);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }

        .cell.marked {
            background-color: var(--accent);
            color: var(--bg-main);
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
            transform: scale(0.95);
        }

        /* New Winning Gold Cell Style Rules */
        .cell.marked.winner {
            background-color: var(--gold) !important;
            border-color: var(--gold) !important;
            color: var(--bg-main) !important;
            box-shadow: 0 0 25px var(--gold-glow) !important;
            transform: scale(1.05);
            z-index: 10;
        }

        /* History Stream */
        .history-stream {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 10px;
            background: rgba(5, 5, 7, 0.5);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            font-size: 0.8rem;
            align-items: center;
            scrollbar-width: none;
        }
        .history-stream::-webkit-scrollbar { display: none; }

        .history-pill {
            background: var(--bg-surface);
            padding: 4px 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            flex-shrink: 0;
        }
        .history-pill:first-child {
            border-color: var(--accent);
            color: var(--accent);
            font-weight: bold;
        }

        /* Toast Popup Alerts */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1000;
        }

        .toast {
            background: #110709;
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideIn {
            from { transform: translateX(120%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .toast.fade-out {
            animation: slideOut 0.3s ease forwards;
        }

        @keyframes slideOut {
            to { transform: translateX(120%); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="video-bg-container" id="wallpaperContainer">
        <video id="bgVideo" autoplay muted loop playsinline>
            <source src="https://motionbgs.com/media/4553/miku-nakano.960x540.mp4" type="video/mp4">
        </video>
    </div>
    <div class="video-overlay"></div>

    <div class="header-bar">
        <h1>Solo Bingo</h1>
        <div class="button-group">
            <button class="btn btn-icon" onclick="toggleSettingsPanel()" title="Options">⚙️</button>
            <button class="btn" onclick="initGame()">New Game</button>
        </div>
    </div>

    <div class="settings-panel" id="settingsPanel">
        <div class="setting-item">
            <div class="setting-label">
                <span>Callout Speed</span>
                <span id="speedValue">5s</span>
            </div>
            <input type="range" id="speedSlider" class="slider-input" min="1" max="10" value="5" oninput="updateSpeedSetting(this.value)">
        </div>
        <div class="setting-item">
            <div class="setting-label">Custom Background Wallpaper Asset (MP4, GIF, PNG, JPG)</div>
            <div class="setting-input-wrapper">
                <input type="text" id="wallpaperInput" class="text-input" placeholder="Paste media URL link here..." value="https://motionbgs.com/media/4553/miku-nakano.960x540.mp4">
                <button class="btn" onclick="applyCustomWallpaper()">Apply</button>
                <button class="btn" onclick="resetDefaultWallpaper()">Reset</button>
            </div>
        </div>
    </div>
    
    <div class="game-layout">
        <div class="live-display">
            <div class="status-text" id="statusMessage">Current Number</div>
            <div class="ball-wrapper">
                <div id="ballDisplay" class="ball-number">-</div>
            </div>
            <div style="display: flex; justify-content: center; gap: 10px; margin-top: 10px;">
                <button id="actionBtn" class="btn btn-primary" onclick="toggleAutoDraw()">Resume Callout</button>
            </div>
            <div style="margin-top: 16px; text-align: left;">
                <div class="status-text" style="margin-bottom: 6px;">Calling History:</div>
                <div class="history-stream" id="historyStream">
                    <div class="status-text">No numbers called yet.</div>
                </div>
            </div>
        </div>

        <div class="health-container" id="healthContainer">
            <span class="heart">❤️</span>
            <span class="heart">❤️</span>
            <span class="heart">❤️</span>
        </div>

        <div class="bingo-board">
            <div class="grid" id="cardGrid"></div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        const cardGrid = document.getElementById('cardGrid');
        const ballDisplay = document.getElementById('ballDisplay');
        const statusMessage = document.getElementById('statusMessage');
        const actionBtn = document.getElementById('actionBtn');
        const historyStream = document.getElementById('historyStream');
        const toastContainer = document.getElementById('toastContainer');
        const healthContainer = document.getElementById('healthContainer');
        const settingsPanel = document.getElementById('settingsPanel');
        const speedValue = document.getElementById('speedValue');
        const wallpaperContainer = document.getElementById('wallpaperContainer');
        const wallpaperInput = document.getElementById('wallpaperInput');

        const DEFAULT_WALLPAPER = "https://motionbgs.com/media/4553/miku-nakano.960x540.mp4";

        let drawnBalls = [];
        let cardMatrix = [];
        let cardNumbersList = []; // Track numbers present anywhere on the current card
        let turnsSinceCardHit = 0; // Turn counter tracker
        let gameOver = false;
        let autoDrawInterval = null;
        let lives = 3;
        let drawSpeedMs = 5000; 
        let isAutoDrawing = false;

        function initGame() {
            stopAutoDraw();
            isAutoDrawing = false;
            
            drawnBalls = [];
            cardMatrix = Array.from({ length: 5 }, () => Array(5).fill(null));
            cardNumbersList = [];
            turnsSinceCardHit = 0;
            gameOver = false;
            lives = 3;
            
            ballDisplay.textContent = "-";
            ballDisplay.classList.remove('active');
            statusMessage.textContent = "Current Number";
            statusMessage.style.color = "var(--text-muted)";
            actionBtn.textContent = "Begin Callout";
            actionBtn.disabled = false;
            actionBtn.classList.add('btn-primary');
            historyStream.innerHTML = '<div class="status-text">No numbers called yet.</div>';

            healthContainer.innerHTML = `
                <span class="heart">❤️</span>
                <span class="heart">❤️</span>
                <span class="heart">❤️</span>
            `;

            generatePureCard();
        }

        function generatePureCard() {
            cardGrid.innerHTML = '';
            let pool = Array.from({ length: 75 }, (_, i) => i + 1);
            
            for (let i = pool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pool[i], pool[j]] = [pool[j], pool[i]];
            }

            let chosenNumbers = pool.slice(0, 25);
            cardNumbersList = [...chosenNumbers]; // Save list copy for guaranteed draw routines
            let index = 0;

            for (let row = 0; row < 5; row++) {
                for (let col = 0; col < 5; col++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    
                    let num = chosenNumbers[index++];
                    cell.textContent = num;
                    cell.dataset.number = num;
                    cell.dataset.marked = "false";
                    
                    cell.addEventListener('click', () => daubCell(cell));
                    
                    cardGrid.appendChild(cell);
                    cardMatrix[row][col] = cell;
                }
            }
        }

        function toggleSettingsPanel() {
            if (settingsPanel.style.display === "flex") {
                settingsPanel.style.display = "none";
            } else {
                settingsPanel.style.display = "flex";
            }
        }

        function updateSpeedSetting(val) {
            speedValue.textContent = val + "s";
            drawSpeedMs = parseInt(val) * 1000;
            
            // Live adjustments update automatically if it's currently running
            if (isAutoDrawing && !gameOver) {
                clearInterval(autoDrawInterval);
                autoDrawInterval = setInterval(drawBall, drawSpeedMs);
            }
        }

        function applyCustomWallpaper() {
            const url = wallpaperInput.value.trim();
            if (!url) return;

            // Sanitize query parameters out to discover real asset extension structures
            const baseUrls = url.split('?');
            const isVideo = baseUrls.endsWith('.mp4') || baseUrls.endsWith('.webm');

            if (isVideo) {
                wallpaperContainer.style.backgroundImage = "none";
                wallpaperContainer.innerHTML = `
                    <video id="bgVideo" autoplay muted loop playsinline>
                        <source src="${url}" type="video/mp4">
                    </video>
                `;
            } else {
                // Treats fallback configurations as images or GIFs instantly
                wallpaperContainer.innerHTML = "";
                wallpaperContainer.style.backgroundImage = `url('${url}')`;
            }
        }

        function resetDefaultWallpaper() {
            wallpaperInput.value = DEFAULT_WALLPAPER;
            wallpaperContainer.style.backgroundImage = "none";
            wallpaperContainer.innerHTML = `
                <video id="bgVideo" autoplay muted loop playsinline>
                    <source src="${DEFAULT_WALLPAPER}" type="video/mp4">
                </video>
            `;
        }

        function toggleAutoDraw() {
            if (gameOver) return;

            if (isAutoDrawing) {
                stopAutoDraw();
            } else {
                isAutoDrawing = true;
                actionBtn.textContent = "Pause Callout";
                actionBtn.classList.remove('btn-primary');
                statusMessage.textContent = `Current Number`;
                
                // FIXED Check: Only call drawBall() instantly if it's the very first ball of the game
                if (drawnBalls.length === 0) {
                    drawBall();
                }
                
                // Then resume normal interval sequence without skipping
                autoDrawInterval = setInterval(drawBall, drawSpeedMs);
            }
        }

        function stopAutoDraw() {
            isAutoDrawing = false;
            if (autoDrawInterval) {
                clearInterval(autoDrawInterval);
                autoDrawInterval = null;
                actionBtn.textContent = "Resume Callout";
                actionBtn.classList.add('btn-primary');
                if(!gameOver) statusMessage.textContent = "Current Number";
            }
        }

        function drawBall() {
            if (drawnBalls.length >= 75) {
                stopAutoDraw();
                statusMessage.textContent = "All nodes processed.";
                actionBtn.disabled = true;
                return;
            }

            let newBall;
            // Check if 5 consecutive rolls have passed without hitting a number on the card
            const forceCardHit = (turnsSinceCardHit >= 5);
            
            // Get uncalled pool numbers that are physically on our card matrix
            const uncalledCardNumbers = cardNumbersList.filter(num => !drawnBalls.includes(num));

            if (forceCardHit && uncalledCardNumbers.length > 0) {
                // Select a guaranteed card number randomly from remaining pool options
                const randomIdx = Math.floor(Math.random() * uncalledCardNumbers.length);
                newBall = uncalledCardNumbers[randomIdx];
                turnsSinceCardHit = 0; // Reset counter since we hit a card node
            } else {
                // Default RNG standard pull
                do {
                    newBall = Math.floor(Math.random() * 75) + 1;
                } while (drawnBalls.includes(newBall));

                // If drawn ball is on our card, reset streak counter. Otherwise increment.
                if (cardNumbersList.includes(newBall)) {
                    turnsSinceCardHit = 0;
                } else {
                    turnsSinceCardHit++;
                }
            }

            drawnBalls.push(newBall);
            
            ballDisplay.textContent = newBall;
            ballDisplay.classList.add('active');
            
            updateHistoryUI();
        }

        function updateHistoryUI() {
            historyStream.innerHTML = '';
            for (let i = drawnBalls.length - 1; i >= 0; i--) {
                const pill = document.createElement('div');
                pill.classList.add('history-pill');
                pill.textContent = drawnBalls[i];
                historyStream.appendChild(pill);
            }
        }

        function daubCell(cell) {
            if (gameOver) return;
            
            let cellNum = parseInt(cell.dataset.number);

            if (drawnBalls.includes(cellNum)) {
                if (cell.dataset.marked === "false") {
                    cell.classList.add('marked');
                    cell.dataset.marked = "true";
                    checkWinCondition();
                }
            } else {
                handleWrongMark(cellNum);
            }
        }

        function handleWrongMark(number) {
            if (gameOver) return;

            lives--;
            showToast(`Number ${number} hasn't been called yet!`);

            const hearts = healthContainer.querySelectorAll('.heart:not(.lost)');
            if (hearts.length > 0) {
                hearts[hearts.length - 1].classList.add('lost');
            }

            if (lives <= 0) {
                executeGameOver(false);
            }
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.classList.add('toast');
            toast.innerHTML = `⚠️ &nbsp; ${message}`;
            
            toastContainer.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.add('fade-out');
                toast.addEventListener('animationend', () => {
                    toast.remove();
                });
            }, 2800);
        }

        function checkWinCondition() {
            let winningCells = new Set();

            // Check Row wins
            for (let r = 0; r < 5; r++) {
                if (cardMatrix[r].every(cell => cell.dataset.marked === "true")) {
                    cardMatrix[r].forEach(cell => winningCells.add(cell));
                }
            }

            // Check Column wins
            for (let c = 0; c < 5; c++) {
                let colCells = [];
                for (let r = 0; r < 5; r++) {
                    colCells.push(cardMatrix[r][c]);
                }
                if (colCells.every(cell => cell.dataset.marked === "true")) {
                    colCells.forEach(cell => winningCells.add(cell));
                }
            }

            // Diagonal 1 (Top-Left to Bottom-Right)
            let diag1Cells = [];
            for (let i = 0; i < 5; i++) {
                diag1Cells.push(cardMatrix[i][i]);
            }
            if (diag1Cells.every(cell => cell.dataset.marked === "true")) {
                diag1Cells.forEach(cell => winningCells.add(cell));
            }

            // Diagonal 2 (Top-Right to Bottom-Left)
            let diag2Cells = [];
            for (let i = 0; i < 5; i++) {
                diag2Cells.push(cardMatrix[i][4 - i]);
            }
            if (diag2Cells.every(cell => cell.dataset.marked === "true")) {
                diag2Cells.forEach(cell => winningCells.add(cell));
            }

            // If we found any complete winning strings, parse them to gold elements
            if (winningCells.size > 0) {
                winningCells.forEach(cell => cell.classList.add('winner'));
                executeGameOver(true);
            }
        }

        function executeGameOver(isWin) {
            gameOver = true;
            stopAutoDraw();
            actionBtn.disabled = true;

            if (isWin) {
                statusMessage.textContent = "BINGO!";
                statusMessage.style.color = "var(--gold)";
            } else {
                statusMessage.textContent = "YOU LOSE!";
                statusMessage.style.color = "var(--danger)";
                document.querySelectorAll('.cell:not(.marked)').forEach(c => c.style.opacity = '0.2');
            }
        }

        initGame();
    </script>
</body>
</html>
